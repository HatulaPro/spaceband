<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060818">
<title>spaceband</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css?v=8">
<script type="importmap">
{ "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
} }
</script>
</head>
<body>
<canvas id="sky" aria-label="Map of music artists"></canvas>
<div id="labels" aria-hidden="true"></div>

<header id="top">
  <div class="brand">
    <h1>spaceband</h1>
    <p id="stats">Loading the map…</p>
  </div>
  <div class="search" role="combobox" aria-expanded="false" aria-haspopup="listbox" aria-owns="results">
    <input id="q" type="search" placeholder="Search for an artist" autocomplete="off" spellcheck="false" aria-label="Search for an artist" aria-controls="results">
    <kbd>/</kbd>
    <ul id="results" role="listbox" hidden></ul>
  </div>
</header>

<aside id="panel" hidden aria-live="polite">
  <button class="close" id="close" aria-label="Close">×</button>
  <div id="panel-body"></div>
</aside>

<nav id="controls">
  <div class="seg" role="group" aria-label="View">
    <button id="v3" class="on" aria-pressed="true">3D</button>
    <button id="v2" aria-pressed="false">2D</button>
  </div>
  <button id="scenes-btn" aria-expanded="false">Scenes</button>
  <button id="labels-btn" aria-pressed="true">Names</button>
  <button id="reset-btn">Reset view</button>
</nav>

<section id="scenes" hidden>
  <h2>Scenes</h2>
  <p class="hint">Groups of artists that share listeners. Pick one to fly there.</p>
  <ol id="scene-list"></ol>
</section>

<div id="tip" hidden></div>
<div id="loading"><span>Charting artists…</span></div>

<script type="module" src="app.js?v=8"></script>
</body>
</html>
